[project]
name = "sales-lead-qualification-agent"
version = "1.0.0"
description = "AI-assisted B2B sales lead qualification with deterministic scoring, BANT, LangGraph workflow and human approval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<2.2",
  "alembic>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "email-validator>=2.1,<3.0",
  "python-multipart>=0.0.9",
  "bcrypt>=4.1,<6.0",
  "pyjwt>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.2,<2.0",
  "google-genai>=1.0,<3.0",
  "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP046", "UP047"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E402", "B017", "E731", "I001"]
"alembic/versions/*" = ["E501", "I001", "UP", "F401"]
